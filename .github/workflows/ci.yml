name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Analyze and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable

      - name: Install build dependencies
        run: |
          # -TrustRepository instead of Set-PSResourceRepository: on a fresh Linux runner the
          # PSResourceGet repository store does not exist yet and Set-PSResourceRepository fails.
          $common = @{ Repository = 'PSGallery'; TrustRepository = $true; Scope = 'CurrentUser'; Quiet = $true }
          Install-PSResource -Name Pester -Version '[5.5.0,6.0.0)' @common
          Install-PSResource -Name PSScriptAnalyzer -Version '[1.21.0,2.0.0)' @common

      - name: Analyze, test and build
        run: ./build/build.ps1 -Task Analyze, Test, Build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/output/testResults.xml
          if-no-files-found: ignore
