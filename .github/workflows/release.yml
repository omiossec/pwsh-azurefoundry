name: Release

# Runs on a version tag. Every tag builds, tests and uploads the module as a workflow artifact.
# Only a stable tag (v0.1.0, no prerelease suffix) is published to the PowerShell Gallery:
# pre-releases (v0.1.0-alpha) stay private build artifacts (spec §12, Q-5).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $manifest   = Import-PowerShellDataFile ./src/PwshAzureFoundry/PwshAzureFoundry.psd1
          $prerelease = $manifest.PrivateData.PSData['Prerelease']
          $version    = if ($prerelease) { "$($manifest.ModuleVersion)-$prerelease" } else { $manifest.ModuleVersion }
          if ($env:TAG_NAME -cne "v$version") {
              throw "Tag '$env:TAG_NAME' does not match the manifest version 'v$version'."
          }
          $stable = if ($prerelease) { 'false' } else { 'true' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "stable=$stable"   >> $env:GITHUB_OUTPUT
          Write-Information "Version $version (stable: $stable)" -InformationAction Continue

      - name: Install build dependencies
        run: |
          $common = @{ Repository = 'PSGallery'; TrustRepository = $true; Scope = 'CurrentUser'; Quiet = $true }
          Install-PSResource -Name Pester -Version '[5.5.0,6.0.0)' @common
          Install-PSResource -Name PSScriptAnalyzer -Version '[1.21.0,2.0.0)' @common

      - name: Analyze, test and build
        run: ./build/build.ps1 -Task Analyze, Test, Build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/output/testResults.xml
          if-no-files-found: ignore

      - name: Upload the built module
        uses: actions/upload-artifact@v4
        with:
          name: PwshAzureFoundry-${{ steps.version.outputs.version }}
          path: build/output/PwshAzureFoundry
          if-no-files-found: error

  publish:
    name: Publish to the PowerShell Gallery
    needs: build
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to gate the publish.
    environment: psgallery
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download the built module
        uses: actions/download-artifact@v4
        with:
          name: PwshAzureFoundry-${{ needs.build.outputs.version }}
          path: build/output/PwshAzureFoundry

      - name: Publish
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'The PSGALLERY_API_KEY secret is not set.' }
          $key = ConvertTo-SecureString -String $env:PSGALLERY_API_KEY -AsPlainText -Force
          ./build/build.ps1 -Task Publish -NuGetApiKey $key
